<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — PulseForge</title>
    <meta name="description" content="Sign in to PulseForge — AI & Trend Intelligence Dashboard">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">

    <!-- Animated Background -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <main class="login-container">

        <!-- Brand -->
        <div class="login-brand">
            <div class="login-logo">⚡</div>
            <h1 class="login-app-name">PulseForge</h1>
            <p class="login-tagline">AI &amp; Trend Intelligence Platform</p>
        </div>

        <!-- Card -->
        <div class="login-card">
            <h2 class="login-heading">Welcome back</h2>
            <p class="login-subheading">Sign in to your dashboard</p>

            <div id="loginError" class="login-error hidden">
                <span>⚠️</span> <span id="loginErrorText">Invalid credentials.</span>
            </div>

            <form id="loginForm" autocomplete="on">
                <div class="field-group">
                    <label class="field-label" for="email">Email address</label>
                    <input
                        class="field-input" type="email" id="email" name="email"
                        placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="field-group">
                    <label class="field-label" for="password">Password</label>
                    <div class="field-password-wrap">
                        <input
                            class="field-input" type="password" id="password" name="password"
                            placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="field-eye" id="togglePwd" title="Show/hide password">
                            <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span id="loginBtnText">Sign In</span>
                    <div id="loginSpinner" class="btn-spinner hidden"></div>
                </button>
            </form>

            <p class="login-footer-note">
                🔒 Secured session &nbsp;·&nbsp; PulseForge v2.0
            </p>
        </div>

    </main>

    <script>
        const form        = document.getElementById('loginForm');
        const loginBtn    = document.getElementById('loginBtn');
        const loginBtnTxt = document.getElementById('loginBtnText');
        const loginSpinner= document.getElementById('loginSpinner');
        const errorBox    = document.getElementById('loginError');
        const errorText   = document.getElementById('loginErrorText');
        const togglePwd   = document.getElementById('togglePwd');
        const pwdInput    = document.getElementById('password');
        const eyeOpen     = document.getElementById('eyeOpen');
        const eyeClosed   = document.getElementById('eyeClosed');

        togglePwd.addEventListener('click', () => {
            const show = pwdInput.type === 'password';
            pwdInput.type      = show ? 'text' : 'password';
            eyeOpen.style.display   = show ? 'none'  : '';
            eyeClosed.style.display = show ? ''      : 'none';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            loginBtn.disabled  = true;
            loginBtnTxt.style.opacity = '0';
            loginSpinner.classList.remove('hidden');

            const email    = document.getElementById('email').value.trim();
            const password = pwdInput.value;

            try {
                const res  = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                const data = await res.json();
                if (data.ok) {
                    window.location.href = data.redirect || '/';
                } else {
                    errorText.textContent = data.error || 'Invalid credentials.';
                    errorBox.classList.remove('hidden');
                    loginBtn.disabled       = false;
                    loginBtnTxt.style.opacity = '1';
                    loginSpinner.classList.add('hidden');
                }
            } catch(err) {
                errorText.textContent = 'Connection error. Please try again.';
                errorBox.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtnTxt.style.opacity = '1';
                loginSpinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
